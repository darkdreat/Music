        class BgView(c: Context) : View(c) {
            private val p = Paint()
            private val ph = FloatArray(3000) { (Math.random() * 6.28).toFloat() }
            var playing = false
            var boost = 0f
            var starsEnabled = true
            var motionEnabled = true
            var intensity = 70
            override fun onDraw(cv: Canvas) {
                val t = if (motionEnabled) SystemClock.uptimeMillis() / 1000f else 0f
                val d = resources.displayMetrics.density
                val s = 34 * d; val g = 4 * d
                val cols = (width / (s + g)).toInt() + 1; val rows = (height / (s + g)).toInt() + 1
                val pulse = if (playing) (.35f + .65f * abs(sin(t * 2.4f))) * (.3f + boost) else 0f
                for (y in 0 until rows) for (x in 0 until cols) {
                    val v = .5f + .5f * sin(t * .8f + ph[(y * cols + x) % ph.size])
                    val w = .5f + .5f * sin(x * .35f + y * .25f - t * 4f)
                    val a = ((.025f + .07f * v + pulse * .35f * w) * intensity / 70f).coerceIn(0f,.7f)
                    val hi = pulse * w > .3f
                    p.color = Color.argb((a * 255).toInt(), if (hi) 200 else 124, if (hi) 160 else 58, 237)
                    cv.drawRoundRect(x * (s + g), y * (s + g), x * (s + g) + s, y * (s + g) + s, 4*d, 4*d, p)
                }
                if (starsEnabled) {
                    for (i in 0 until 115) {
                        val x = ((i * 97 + 31) % max(1,width)).toFloat()
                        val y = ((i * 193 + 71) % max(1,height)).toFloat()
                        val tw = if (motionEnabled) (.35f + .65f * abs(sin(t * (0.7f + (i%5)*.16f) + ph[i]))) else .65f
                        p.color = Color.argb((tw * 180).toInt(), 224, 205, 255)
                        cv.drawCircle(x, y, (if (i%13==0) 1.8f else 1f)*d, p)
                    }
                }
                if (motionEnabled) postInvalidateOnAnimation()
            }
        }

