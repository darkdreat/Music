        package com.galaxy.booster
        import android.app.*
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.ServiceInfo
        import android.media.audiofx.AudioEffect
        import android.os.Build
        import android.os.IBinder
        class KeepService : Service() {
            val rx = SessRx()
            override fun onBind(i: Intent?): IBinder? = null
            override fun onCreate() {
                super.onCreate()
                val f = IntentFilter().apply { addAction(AudioEffect.ACTION_OPEN_AUDIO_EFFECT_CONTROL_SESSION); addAction(AudioEffect.ACTION_CLOSE_AUDIO_EFFECT_CONTROL_SESSION) }
                if (Build.VERSION.SDK_INT >= 33) registerReceiver(rx, f, RECEIVER_EXPORTED) else registerReceiver(rx, f)
            }
            override fun onStartCommand(i: Intent?, fl: Int, id: Int): Int {
                val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                nm.createNotificationChannel(NotificationChannel("gb", "Galaxy Booster", NotificationManager.IMPORTANCE_LOW))
                val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                val n = Notification.Builder(this, "gb").setContentTitle("Galaxy Booster çalışıyor").setSmallIcon(android.R.drawable.ic_media_play).setContentIntent(pi).build()
                if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK) else startForeground(1, n)
                return START_STICKY
            }
            override fun onDestroy() { try { unregisterReceiver(rx) } catch (e: Exception) {}; super.onDestroy() }
        }
