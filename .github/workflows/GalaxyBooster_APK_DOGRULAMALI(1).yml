        EOF

        cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
         <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
         <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
         <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
         <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
         <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
         <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
         <uses-permission android:name="android.permission.SET_WALLPAPER"/>
         <uses-permission android:name="android.permission.WAKE_LOCK"/>
         <uses-permission android:name="android.permission.INTERNET"/>
         <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
         <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
         <uses-permission android:name="android.permission.CAMERA"/>
         <uses-permission android:name="android.permission.RECORD_AUDIO"/>
         <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@style/T">
          <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
           <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          <receiver android:name=".GalaxyClockWidget" android:exported="true" android:permission="android.permission.BIND_APPWIDGET">
           <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/><action android:name="android.intent.action.TIME_TICK"/><action android:name="android.intent.action.TIME_CHANGED"/></intent-filter>
           <meta-data android:name="android.appwidget.provider" android:resource="@xml/galaxy_clock_widget"/>
          </receiver>
          <service android:name=".KeepService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
          <receiver android:name=".SessRx" android:exported="true">
           <intent-filter>
            <action android:name="android.media.action.OPEN_AUDIO_EFFECT_CONTROL_SESSION"/>
            <action android:name="android.media.action.CLOSE_AUDIO_EFFECT_CONTROL_SESSION"/>
           </intent-filter>
          </receiver>
         </application>
        </manifest>
        EOF
        cat > $R/xml/galaxy_clock_widget.xml <<'EOF'
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
