                }
                for(i in 0 until 10) eqValues[i] = values[i]
                getPreferences(0).edit().putString("eq_preset", name).putString("eq_values", eqValues.joinToString(",")).apply()
                applyEq(); toast("$name profili uygulandı")
            }
            fun saveEqPreset() {
                getPreferences(0).edit().putString("eq_values", eqValues.joinToString(",")).putString("eq_preset", "Custom").apply()
                toast("Ekolayzır profilin kaydedildi")
            }
            fun settingsDialog() {
                val panel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(18),dp(8),dp(18),dp(8)) }
                panel.addView(sw("Hareketli yıldız arka planı") { bg.starsEnabled = it })
                panel.addView(sw("Animasyonları etkinleştir") { bg.motionEnabled = it; bg.invalidate() })
                panel.addView(sw("Galaksi ses tepkisi") { bg.playing = it && mp?.isPlaying == true })
                panel.addView(sw("Otomatik ses profili") { autoProfile = it; toast(if(it) "Otomatik profil açık" else "Otomatik profil kapalı") })
                panel.addView(tv("Galaksi parlaklığı",13f))
                panel.addView(sb(100,bg.intensity) { bg.intensity = it; bg.invalidate() })
                val themes = arrayOf("Derin mor","Nebula","Gece siyahı","Menekşe")
                panel.addView(btn("Tema: ${themes[galaxyHue % themes.size]}") { galaxyHue=(galaxyHue+1)%themes.size; wallpaperStudio() }.apply { layoutParams = LinearLayout.LayoutParams(-1, dp(48)) })
                android.app.AlertDialog.Builder(this).setTitle("Galaxy Booster ayarları").setView(panel).setPositiveButton("Kaydet") { _,_ -> getPreferences(0).edit().putBoolean("stars",bg.starsEnabled).putBoolean("motion",bg.motionEnabled).putInt("intensity",bg.intensity).putBoolean("autoprofile",autoProfile).apply(); toast("Ayarlar kaydedildi") }.setNegativeButton("Kapat",null).show()
            }
            fun profileDialog() {
                val items = arrayOf("Normal / Flat","Bass ağırlıklı","Konuşma / Vocal","Rock","Pop","Jazz","Classical")
                android.app.AlertDialog.Builder(this).setTitle("Ses profili seç").setItems(items) { _,i -> applyPreset(arrayOf("Flat","Bass","Vocal","Rock","Pop","Jazz","Classical")[i]) }.show()
            }
            fun shareApp() {
                val i = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT,"Galaxy Booster - mor galaksi temalı ses ve kamera merkezi")
                startActivity(Intent.createChooser(i,"Paylaş"))
            }
            fun aboutDialog() {
                android.app.AlertDialog.Builder(this).setTitle("Galaxy Booster Ultimate").setMessage("Sürüm 2.1\nMüzik çalar, ses efektleri, ekolayzır, kamera kısayolları, cihaz araçları ve galaksi kişiselleştirmesi.\n\nSes efektlerinin kullanılabilirliği Android cihazına ve üretici yazılımına bağlıdır.").setPositiveButton("Tamam",null).show()
            }
            fun setLive(v: Int) { liveSeconds = v.coerceIn(2,15); getPreferences(0).edit().putInt("live_seconds", liveSeconds).apply(); if (::liveLabel.isInitialized) liveLabel.text = "Hareketli çekim süresi: $liveSeconds saniye"; toast("Hareketli çekim süresi: $liveSeconds saniye") }
            fun launchCamera(video: Boolean) {
                try { val i = Intent(if (video) android.provider.MediaStore.ACTION_VIDEO_CAPTURE else android.provider.MediaStore.ACTION_IMAGE_CAPTURE)
                    if (video) i.putExtra(android.provider.MediaStore.EXTRA_DURATION_LIMIT, liveSeconds)
                    startActivityForResult(i, if (video) 902 else 901)
                } catch (e: Exception) { toast("Kamera uygulaması açılamadı") }
            }
            fun deviceInfo() { toast("${Build.MANUFACTURER} ${Build.MODEL} • Android ${Build.VERSION.RELEASE} • API ${Build.VERSION.SDK_INT}") }
            fun batteryInfo() { val bm = getSystemService(BATTERY_SERVICE) as BatteryManager; val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY); toast("Pil seviyesi: %$level • Durum: ${if (level <= 20) "Düşük" else "Normal"}") }
            fun wifiInfo() { try { val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager; val inf = wm.connectionInfo; toast(if (inf.networkId == -1) "Wi-Fi bağlı değil" else "Wi-Fi: ${inf.ssid} • Sinyal: ${WifiManager.calculateSignalLevel(inf.rssi, 5)}/5") } catch (e: Exception) { toast("Wi-Fi bilgisi alınamadı") } }
            fun speedTest() { toast("Bağlantı testi başlatıldı"); Thread { val start = System.currentTimeMillis(); val result = try { val c = URL("https://clients3.google.com/generate_204").openConnection() as HttpURLConnection; c.connectTimeout = 5000; c.readTimeout = 5000; c.connect(); c.responseCode; c.disconnect(); "Yanıt süresi: ${System.currentTimeMillis()-start} ms" } catch (e: Exception) { "Bağlantı testi başarısız" }; runOnUiThread { toast(result) } }.start() }
            fun wallpaperStudio() {
                galaxyBg.setImageResource(R.drawable.galaxy_wallpaper)
                galaxyBg.alpha = 0.78f
                toast("Mor galaksi arka planı etkin")
            }
            fun applyPhoneWallpaper() {
                try {
                    val bitmap = android.graphics.BitmapFactory.decodeResource(resources, R.drawable.galaxy_wallpaper)
                    android.app.WallpaperManager.getInstance(this).setBitmap(bitmap)
                    bitmap.recycle()
                    toast("Galaksi telefon duvar kâğıdı yapıldı")
                } catch (e: Exception) { toast("Duvar kâğıdı ayarlanamadı: ${e.message ?: "izin veya cihaz desteği gerekli"}") }
            }
            fun notes() { val input = EditText(this).apply { setText(getPreferences(0).getString("notes", "")); minLines = 4; setTextColor(Color.WHITE) }; android.app.AlertDialog.Builder(this).setTitle("Galaxy Notları").setView(input).setPositiveButton("Kaydet") { _, _ -> getPreferences(0).edit().putString("notes", input.text.toString()).apply(); toast("Not kaydedildi") }.setNegativeButton("Kapat", null).show() }
            fun sleepDialog() { val opts = arrayOf("15 dakika","30 dakika","45 dakika","60 dakika","Zamanlayıcıyı kapat"); android.app.AlertDialog.Builder(this).setTitle("Uyku zamanlayıcısı").setItems(opts) { _, w -> sleep(if (w == 4) 0 else arrayOf(15,30,45,60)[w]) }.show() }
            fun vaultInfo() { toast("Galaxy Vault: Bu sürümde dosya kasası bilgilendirmesi. Güvenli şifreli kasa için ayrıca şifreleme ve dosya seçici modülü gerekir.") }
            fun sleep(m: Int) {
                h.removeCallbacks(sleepR)
                if (m > 0) { h.postDelayed(sleepR, m * 60000L); toast("$m dk sonra durdurulacak") } else toast("Zamanlayıcı kapalı")
            }
            val sleepR = Runnable { mp?.pause(); onState() }

            /* Telefondaki müzikleri tara */
            fun loadLib() {
                uris.clear(); names.clear()
                val base = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                val m = MediaStore.Audio.Media.DURATION
                try {
                    contentResolver.query(base, arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST),
                        "$m>=30000 AND ${MediaStore.Audio.Media.IS_RINGTONE}=0 AND ${MediaStore.Audio.Media.IS_NOTIFICATION}=0 AND ${MediaStore.Audio.Media.IS_ALARM}=0",
                        null, MediaStore.Audio.Media.DATE_ADDED + " DESC")?.use { c ->
                        while (c.moveToNext()) {
                            uris.add(ContentUris.withAppendedId(base, c.getLong(0)))
                            val a = c.getString(2)
                            names.add(c.getString(1) + (if (a != null && a != "<unknown>") " - " + a else ""))
                        }
                    }
                } catch (e: Exception) { toast("Müzik izni gerekli") }
                renderLib("")
            }
            fun renderLib(q: String) {
                lib.removeAllViews(); var n = 0
                for (i in names.indices) {
                    if (q.isEmpty() || names[i].contains(q, true)) {
                        lib.addView(tv(names[i], 14f).apply { maxLines = 1; ellipsize = android.text.TextUtils.TruncateAt.END; setPadding(dp(4), dp(11), dp(4), dp(11)); setOnClickListener { play(i) } })
                        if (++n >= 40) break
                    }
                }
                tCount.text = "${uris.size} şarkı" + if (n >= 40) " (ilk 40 gösteriliyor, aramayı kullan)" else ""
            }

            fun play(i: Int) {
                if (i < 0 || i >= uris.size) return
                idx = i
                mp?.let { Fx.remove(it.audioSessionId); it.release() }; bb?.release(); vz?.release()
                try {
                    mp = MediaPlayer().apply { setAudioAttributes(attrs); setDataSource(this@MainActivity, uris[i]); prepare(); setOnCompletionListener { next() } }
                } catch (e: Exception) { toast("Dosya açılamadı"); return }
                val sid = mp!!.audioSessionId
                Fx.add(sid, "galaxy.booster")
                try { bb = BassBoost(0, sid).also { it.enabled = true } } catch (e: Exception) {}
                try { vz = Virtualizer(0, sid).also { it.enabled = true } } catch (e: Exception) {}
                try { eq = Equalizer(0, sid).also { it.enabled = true; applyEq() } } catch (e: Exception) { eq = null }
                am.requestAudioFocus(AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN).setAudioAttributes(attrs).setOnAudioFocusChangeListener(afl).build())
                applyFx(); mp!!.start(); tTitle.text = names[i]
                onState()
            }
            val afl = AudioManager.OnAudioFocusChangeListener { c ->
                when (c) {
                    AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> if (mp?.isPlaying == true) { mp?.pause(); resumeFocus = true; onState() }
                    AudioManager.AUDIOFOCUS_GAIN -> if (resumeFocus) { resumeFocus = false; mp?.start(); onState() }
                    AudioManager.AUDIOFOCUS_LOSS -> { mp?.pause(); onState() }
                }
            }
            fun toggle() { val m = mp ?: return; if (m.isPlaying) m.pause() else m.start(); onState() }
            fun next() { if (uris.isNotEmpty()) play((idx + 1) % uris.size) }
            fun prev() { if ((mp?.currentPosition ?: 0) > 4000) mp?.seekTo(0) else if (uris.isNotEmpty()) play((idx - 1 + uris.size) % uris.size) }
            fun onState() {
                val on = mp?.isPlaying == true
                bPlay.text = if (on) "⏸" else "▶"; bg.playing = on
                pulseAnim?.cancel()
                if (on) pulseAnim = ObjectAnimator.ofPropertyValuesHolder(bPlay, PropertyValuesHolder.ofFloat("scaleX", 1f, 1.08f), PropertyValuesHolder.ofFloat("scaleY", 1f, 1.08f)).apply { duration = 600; repeatMode = ValueAnimator.REVERSE; repeatCount = ValueAnimator.INFINITE; start() }
                else { bPlay.scaleX = 1f; bPlay.scaleY = 1f }
                val st = if (on) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED
                ms.setPlaybackState(PlaybackState.Builder().setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS)
                    .setState(st, (mp?.currentPosition ?: 0).toLong(), 1f).build())
            }

            /* JBL modu: kulaklık tuşları */
            fun setupSession() {
                ms = MediaSession(this, "GalaxyBooster")
                ms.setCallback(object : MediaSession.Callback() {
                    override fun onMediaButtonEvent(i: Intent): Boolean {
                        val e = i.getParcelableExtra<KeyEvent>(Intent.EXTRA_KEY_EVENT)
                        if (e != null && e.action == KeyEvent.ACTION_DOWN && e.repeatCount == 0) runOnUiThread { key(e.keyCode) }
                        return true
                    }
                })
                ms.isActive = true
                onState()
            }
            fun key(k: Int) {
                when (k) {
                    KeyEvent.KEYCODE_VOLUME_UP -> if (jbl) setGain(Fx.gain + 10)
                    KeyEvent.KEYCODE_VOLUME_DOWN -> if (jbl) setGain(Fx.gain - 10)
                    KeyEvent.KEYCODE_MEDIA_NEXT -> next()
                    KeyEvent.KEYCODE_MEDIA_PREVIOUS -> prev()
                    KeyEvent.KEYCODE_MEDIA_STOP -> { mp?.pause(); onState() }
                    KeyEvent.KEYCODE_HEADSETHOOK, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE, KeyEvent.KEYCODE_MEDIA_PLAY, KeyEvent.KEYCODE_MEDIA_PAUSE ->
                        if (!jbl) toggle() else press()
                }
            }
            val pressR = Runnable {
                val n = pc; pc = 0
                when (n) { 1 -> { toggle(); tInfo.text = "1 basış: durdur/devam" }; 2 -> { next(); tInfo.text = "2 basış: sonraki" }; else -> { prev(); tInfo.text = "3 basış: önceki" } }
            }
            fun press() { pc++; h.removeCallbacks(pressR); h.postDelayed(pressR, 380) }
            override fun onKeyDown(k: Int, e: KeyEvent): Boolean {
                if (jbl && (k == KeyEvent.KEYCODE_VOLUME_UP || k == KeyEvent.KEYCODE_VOLUME_DOWN)) { key(k); return true }
                return super.onKeyDown(k, e)
            }
            override fun onDestroy() { super.onDestroy(); try { visual?.release(); eq?.release() } catch (e: Exception) {}; ms.release(); mp?.release() }
        }
        EOF

        # Harici gorsel kutuphanesi gerektirmeden galaksi gorselini uygulama simgesi yap
        cp $R/drawable-nodpi/galaxy_wallpaper.jpg $R/mipmap-xxxhdpi/ic_launcher.jpg
    - name: Gradle surumunu ve projeyi dogrula
      working-directory: GalaxyBooster
      run: |
        set -euo pipefail
        gradle --version
        test -f settings.gradle.kts
        test -f app/build.gradle.kts
        test -f app/src/main/AndroidManifest.xml
    - name: Kotlin kontrolu ve APK derleme
      working-directory: GalaxyBooster
      run: |
        set -euo pipefail
        gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all
    - name: APK dosyasinin olustugunu zorunlu kontrol et
      working-directory: GalaxyBooster
      run: |
        set -euo pipefail
        echo "APK ciktilari kontrol ediliyor..."
        find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
        APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
        if [ -z "$APK" ]; then
          echo "HATA: Gradle tamamlandi ancak debug APK bulunamadi."
          echo "Mevcut build klasorleri:"
          find app/build -maxdepth 5 -type d -print 2>/dev/null | head -200 || true
          exit 1
        fi
        echo "Bulunan APK: $APK"
        ls -lh "$APK"
    - name: Derleme tanilama dosyalari
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: GalaxyBooster-build-diagnostics
        path: |-
          GalaxyBooster/app/build/reports/**
          GalaxyBooster/app/build/outputs/logs/**
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      with:
        name: GalaxyBooster-Ultimate-2.3-APK
        path: GalaxyBooster/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 7
