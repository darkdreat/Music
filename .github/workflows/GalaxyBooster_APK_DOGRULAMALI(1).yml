        }
        EOF
        printf 'org.gradle.jvmargs=-Xmx2g\nandroid.nonTransitiveRClass=true\n' > $P/gradle.properties
        cat > $P/app/build.gradle.kts <<'EOF'
        plugins{id("com.android.application");id("org.jetbrains.kotlin.android")}
        android{
         namespace="com.galaxy.booster";compileSdk=34
         defaultConfig{applicationId="com.galaxy.booster";minSdk=26;targetSdk=34;versionCode=4;versionName="2.2"}
         compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17}
         kotlinOptions{jvmTarget="17"}
        }
