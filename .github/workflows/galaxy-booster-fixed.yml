name: Galaxy Booster Ultimate 2.4 APK
permissions:
  contents: write
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7
    - name: Uretici betigini hazirla
      run: |
        set -e
        : > /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 1/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 2/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 3/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 4/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 5/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 6/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 7/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 8/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigi parcasi 9/9
      run: |
        printf '%s' '' >> /tmp/galaxy_generator.b64
    - name: Uretici betigini dogrula ve ac
      run: |
        set -euo pipefail
        base64 -d /tmp/galaxy_generator.b64 > /tmp/galaxy_generator.sh
        bash -n /tmp/galaxy_generator.sh
        chmod +x /tmp/galaxy_generator.sh
    - name: Android projesini olustur
      run: |
        bash /tmp/galaxy_generator.sh
    - name: Kotlin kaynaklarini derle ve APK olustur
      working-directory: GalaxyBooster
      run: |
        set -o pipefail
        gradle :app:compileDebugKotlin assembleDebug --no-daemon --stacktrace
    - name: APK dosyasini dogrula
      working-directory: GalaxyBooster
      run: "set -euo pipefail\ntest -s app/build/outputs/apk/debug/app-debug.apk\nls -lh app/build/outputs/apk/debug/app-debug.apk"
    - name: APK artifact olarak yukle
      uses: actions/upload-artifact@v4
      with:
        name: Galaxy-Booster-Ultimate-2.4-APK
        path: GalaxyBooster/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
    - name: GitHub Releases bolumune APK ekle
      uses: softprops/action-gh-release@v2
      with:
        tag_name: galaxy-booster-v2.4-${{ github.run_number }}
        name: Galaxy Booster Ultimate 2.4
        body: Galaxy Booster Ultimate 2.4 - APK build.
        files: GalaxyBooster/app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: true
